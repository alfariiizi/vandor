# .ckeletin/configs/lefthook.base.yml
#
# FRAMEWORK-MANAGED: Base git hooks configuration
#
# This file defines the standard quality checks that run as git hooks.
# Projects extend this file in their .lefthook.yml.
#
# Updates to this file are automatically picked up when running
# `task ckeletin:update` (since it's in .ckeletin/).

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: .ckeletin/scripts/taskw.sh format:staged -- {staged_files}
      stage_fixed: true
    lint:
      run: .ckeletin/scripts/taskw.sh lint
    validate-constants:
      run: .ckeletin/scripts/taskw.sh validate:constants
    verify-deps:
      run: .ckeletin/scripts/taskw.sh check:deps:verify
    secret-scan:
      run: .ckeletin/scripts/taskw.sh check:secrets:staged
    vuln-scan:
      run: .ckeletin/scripts/taskw.sh check:vuln:fast
    test:
      run: .ckeletin/scripts/taskw.sh test:unit

pre-push:
  parallel: false
  commands:
    coverage:
      run: .ckeletin/scripts/taskw.sh test:coverage
